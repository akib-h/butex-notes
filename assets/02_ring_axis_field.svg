<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="120" cy="100" rx="30" ry="70" fill="none" stroke="#e67e22" stroke-width="4"/>
  <text x="120" y="30" text-anchor="middle" font-size="13">Ring, radius R, charge Q</text>
  <line x1="120" y1="100" x2="380" y2="100" stroke="#333" stroke-width="1.5"/>
  <circle cx="300" cy="100" r="5" fill="#2c3e50"/>
  <text x="300" y="85" text-anchor="middle" font-size="13">P</text>
  <line x1="120" y1="30" x2="300" y2="100" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="55" font-size="12">r = √(R²+x²)</text>
  <line x1="120" y1="100" x2="300" y2="100" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="210" y="115" font-size="12">x</text>
  <line x1="300" y1="100" x2="360" y2="100" stroke="#e74c3c" stroke-width="2" marker-end="url(#a2)"/>
  <text x="330" y="90" font-size="12">E (axial)</text>
  <text x="210" y="180" text-anchor="middle" font-size="14">E = Qx / [4πε0(R²+x²)^(3/2)]</text>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e74c3c"/></marker></defs>
</svg>
